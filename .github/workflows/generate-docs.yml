name: Generate Omada Network Documentation

on:
  schedule:
    - cron: "0 2 * * *"   # Run nightly at 02:00 UTC
  workflow_dispatch:        # Allow manual trigger from the GitHub UI

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to commit and push generated docs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate documentation
        env:
          OMADA_BASE_URL:       ${{ secrets.OMADA_BASE_URL }}
          OMADA_CONTROLLER_ID:  ${{ secrets.OMADA_CONTROLLER_ID }}
          OMADA_TOKEN:          ${{ secrets.OMADA_TOKEN }}
          OMADA_SITE_ID:        ${{ secrets.OMADA_SITE_ID }}
          # Set OMADA_NO_VERIFY_SSL to "true" if your controller uses a
          # self-signed TLS certificate.
          OMADA_NO_VERIFY_SSL:  ${{ secrets.OMADA_NO_VERIFY_SSL }}
        run: python cli.py fetch --output-dir docs

      - name: Commit and push generated docs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet \
            || git commit -m "docs: update network documentation [skip ci]"
          git push
